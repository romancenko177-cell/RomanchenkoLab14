<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №14 — Завдання 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .block {
            min-height: 220px;
            padding: 30px;
            color: white;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid white;
        }

        .block-1 { background: #dc3545; }
        .block-2 { background: #198754; }
        .block-3 { background: #0d6efd; }
    </style>
</head>
<body>

<div class="container-fluid">
    <h1 class="text-center my-4">Адаптивна сторінка Bootstrap</h1>

    <div class="row">
        <div class="col-12 col-md-6 col-lg-4 col-xl-4">
            <div class="block block-1">Блок №1</div>
        </div>

        <div class="col-12 col-md-6 col-lg-4 col-xl-4">
            <div class="block block-2">Блок №2</div>
        </div>

        <div class="col-12 col-md-12 col-lg-4 col-xl-4">
            <div class="block block-3">Блок №3</div>
        </div>
    </div>
</div>

</body>
</html>
